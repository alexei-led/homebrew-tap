name: Auto-update Formula
on:
  repository_dispatch:
    types:
      - update-formula
  workflow_dispatch:
    inputs:
      formula:
        description: Formula name (e.g. spotinfo)
        required: true
        type: string
      version:
        description: Version to update to (without v prefix)
        required: false
        type: string
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Determine formula and version
        id: info
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            FORMULA="${{ github.event.client_payload.formula }}"
            VERSION="${{ github.event.client_payload.version }}"
            REPO="${{ github.event.client_payload.repo }}"
          else
            FORMULA="${{ inputs.formula }}"
            VERSION="${{ inputs.version }}"
            REPO="alexei-led/${FORMULA}"
          fi

          if [ -z "$VERSION" ]; then
            VERSION=$(curl -s "https://api.github.com/repos/${REPO}/releases/latest" | jq -r '.tag_name')
          fi
          VERSION="${VERSION#v}"

          {
            echo "FORMULA=${FORMULA}"
            echo "VERSION=${VERSION}"
            echo "REPO=${REPO}"
          } >> "$GITHUB_OUTPUT"
          echo "Updating ${FORMULA} to ${VERSION} from ${REPO}"
      - name: Check if update needed
        id: check
        run: |
          FORMULA_FILE="Formula/${{ steps.info.outputs.FORMULA }}.rb"
          if [ ! -f "$FORMULA_FILE" ]; then
            echo "Formula file not found: $FORMULA_FILE"
            exit 1
          fi

          if ! grep -q 'version "' "$FORMULA_FILE"; then
            echo "Unsupported formula shape: missing explicit version stanza"
            exit 1
          fi

          if ! grep -q '#{version}' "$FORMULA_FILE"; then
            echo "Unsupported formula shape: release URLs must interpolate #{version}"
            exit 1
          fi

          CURRENT=$(grep 'version "' "$FORMULA_FILE" | head -1 | cut -d'"' -f2)
          if [ "$CURRENT" = "${{ steps.info.outputs.VERSION }}" ]; then
            echo "Already up to date ($CURRENT)"
            echo "SKIP=true" >> "$GITHUB_OUTPUT"
          else
            echo "Update: $CURRENT -> ${{ steps.info.outputs.VERSION }}"
            echo "SKIP=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download assets and compute checksums
        if: steps.check.outputs.SKIP != 'true'
        run: |
          VERSION="${{ steps.info.outputs.VERSION }}"
          REPO="${{ steps.info.outputs.REPO }}"
          FORMULA_FILE="${GITHUB_WORKSPACE}/Formula/${{ steps.info.outputs.FORMULA }}.rb"

          mkdir -p /tmp/assets
          ruby <<'RUBY' "$FORMULA_FILE" "$VERSION" > /tmp/assets/urls.txt
          formula_file, version = ARGV
          File.readlines(formula_file, chomp: true).each do |line|
            next unless (match = line.match(/url "([^"]+)"/))

            puts match[1].gsub('#{version}', version)
          end
          RUBY

          cd /tmp/assets
          : > checksums.tsv

          while IFS= read -r url; do
            asset=$(basename "$url")
            echo "Downloading ${asset}..."
            curl -sL -f -o "$asset" "$url" \
              || curl -sL -f -o "$asset" "https://github.com/${REPO}/releases/download/v${VERSION}/${asset}" \
              || curl -sL -f -o "$asset" "https://github.com/${REPO}/releases/download/${VERSION}/${asset}"
            if [ ! -s "$asset" ]; then
              echo "Failed to download $asset"
              exit 1
            fi
            SHA=$(sha256sum "$asset" | cut -d' ' -f1)
            printf '%s\t%s\n' "$asset" "$SHA" >> checksums.tsv
            echo "  ${asset}: ${SHA}"
          done < urls.txt
      - name: Update formula
        if: steps.check.outputs.SKIP != 'true'
        run: |
          VERSION="${{ steps.info.outputs.VERSION }}"
          FORMULA_FILE="Formula/${{ steps.info.outputs.FORMULA }}.rb"

          ruby <<'RUBY' "$FORMULA_FILE" "$VERSION" /tmp/assets/checksums.tsv
          formula_file, version, checksums_file = ARGV

          checksums = File.readlines(checksums_file, chomp: true).to_h do |line|
            asset, sha = line.split("\t", 2)
            [asset, sha]
          end

          lines = File.readlines(formula_file, chomp: true)
          lines[lines.index { |line| line.include?('version "') }] = "  version \"#{version}\""

          current_asset = nil
          lines.map! do |line|
            if (match = line.match(/url "([^"]+)"/))
              current_asset = File.basename(match[1].gsub('#{version}', version))
              line
            elsif current_asset && line.match?(/sha256 "/)
              sha = checksums.fetch(current_asset)
              current_asset = nil
              line.sub(/sha256 "[^"]+"/, %(sha256 "#{sha}"))
            else
              line
            end
          end

          File.write(formula_file, lines.join("\n") + "\n")
          RUBY
      - name: Commit and push
        if: steps.check.outputs.SKIP != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          FORMULA_FILE="Formula/${{ steps.info.outputs.FORMULA }}.rb"
          if ! git diff --quiet "$FORMULA_FILE"; then
            git add "$FORMULA_FILE"
            git commit -m "Update ${{ steps.info.outputs.FORMULA }} to ${{ steps.info.outputs.VERSION }}"
            git push
            echo "✅ Updated ${{ steps.info.outputs.FORMULA }} to ${{ steps.info.outputs.VERSION }}"
          else
            echo "No changes to commit"
          fi
